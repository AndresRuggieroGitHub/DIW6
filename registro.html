<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Crea tu cuenta en Lexi.">
  <meta name="robots" content="noindex">
  <title>Lexi | Crear cuenta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand: #f59e0b;
      --violet: #7c3aed;
      --violet-mid: #9d4edd;
      --text: #1a1a2e;
      --muted: #6b7280;
      --line: #e5e7eb;
      --surface: #f9fafb;
    }
    html, body {
      min-height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(245, 158, 11, 0.16), transparent 24%),
        radial-gradient(circle at 85% 16%, rgba(216, 180, 254, 0.62), transparent 23%),
        linear-gradient(160deg, #dccdea 0%, #f8f3fe 54%, #e2e5f4 100%);
      color: var(--text);
    }
    .auth-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: linear-gradient(180deg, rgba(210, 196, 229, 0.95) 0%, rgba(190, 172, 216, 0.72) 52%, rgba(156, 140, 186, 0.42) 100%);
    }
    .auth-card {
      width: min(100%, 980px);
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      background: #fff;
      border: none;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 28px 70px rgba(51, 24, 96, 0.22);
    }
    .auth-aside {
      padding: 3rem;
      background: radial-gradient(circle at top left, rgba(216, 180, 254, 0.8), transparent 38%), linear-gradient(145deg, #581c87 0%, #7c3aed 55%, #c084fc 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1rem;
      position: relative;
      overflow: hidden;
    }
    .auth-aside-content {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      z-index: 1;
    }
    .auth-title {
      display: inline-flex;
      align-items: center;
      gap: 0.58rem;
      margin-top: 0;
      font-size: clamp(1.95rem, 2.8vw, 2.55rem);
      font-weight: 800;
      color: #fff;
      line-height: 1.08;
      letter-spacing: -0.05em;
      margin-bottom: 0;
    }
    .auth-title i {
      font-size: 0.94em;
      color: #fff;
      line-height: 1;
    }
    .auth-desc {
      margin-top: 0;
      max-width: 20rem;
      color: rgba(255, 255, 255, 0.82);
      line-height: 1.6;
    }
    .auth-form {
      padding: 3rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .auth-form h1 {
      font-size: 1.8rem;
      letter-spacing: -0.04em;
      margin-bottom: 0.45rem;
    }
    .auth-sub {
      color: var(--muted);
      margin-bottom: 1.75rem;
      line-height: 1.6;
    }
    .auth-sub a { color: var(--violet); font-weight: 600; text-decoration: none; }
    .auth-grid { display: grid; gap: 1rem; }
    .auth-field label {
      display: block;
      font-size: 0.86rem;
      font-weight: 600;
      margin-bottom: 0.45rem;
    }
    .auth-input-wrap { position: relative; }
    .auth-input-wrap i {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
    }
    .auth-input-wrap--select .auth-flag-icon {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      width: 1.15rem;
      height: 1.15rem;
      transform: translateY(-50%);
      border-radius: 999px;
      object-fit: cover;
      box-shadow: 0 0 0 1px rgba(148, 163, 184, 0.18);
      opacity: 0;
      transition: opacity 0.15s ease;
      pointer-events: none;
    }
    .auth-input-wrap--select > i {
      transition: opacity 0.15s ease;
    }
    .auth-input-wrap--select.has-flag .auth-flag-icon {
      opacity: 1;
    }
    .auth-input-wrap--select.has-flag > i {
      opacity: 0;
    }
    .auth-input {
      appearance: none;
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      padding: 0.85rem 1rem 0.85rem 2.6rem;
      font: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .auth-input-wrap--select .auth-input {
      padding-left: 2.95rem;
    }
    .auth-input:focus {
      border-color: var(--violet);
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
      background: #fff;
    }
    .auth-input[type="date"] {
      padding-right: 0.85rem;
    }
    .auth-choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }
    .auth-choice {
      border: 1.5px solid var(--line);
      border-radius: 14px;
      padding: 0.9rem;
      background: #fff;
    }
    .auth-choice strong { display: block; margin-bottom: 0.15rem; }
    .auth-choice span { color: var(--muted); font-size: 0.88rem; }
    .auth-check {
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .auth-check input { margin-top: 0.15rem; }
    .auth-btn {
      border: none;
      border-radius: 12px;
      padding: 0.95rem 1.2rem;
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--violet) 0%, var(--violet-mid) 100%);
      cursor: pointer;
    }
    .auth-note {
      margin-top: 1rem;
      font-size: 0.82rem;
      color: var(--muted);
      text-align: center;
    }
    .auth-alert {
      display: none;
      margin-bottom: 1rem;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .auth-alert.show { display: block; }
    .auth-alert--ok { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    @media (max-width: 860px) {
      .auth-card { grid-template-columns: 1fr; }
      .auth-aside {
        padding: 2rem;
        min-height: 132px;
      }
      .auth-form { padding: 2rem; }
      .auth-aside-content {
        width: 100%;
        max-width: 400px;
        margin: 0 auto;
      }
    }
    @media (max-width: 640px) {
      .auth-shell {
      .recovery-brand-panel {
        padding: 1.8rem 2rem;
        min-height: 132px;
      }
        place-items: stretch;
      }
      .auth-card {
        width: 100%;
        min-height: calc(100vh - 1.6rem);
        border-radius: 20px;
        border: none;
        box-shadow: 0 18px 40px rgba(76, 29, 149, 0.12);
      }
      .auth-form {
        padding: 1.35rem 1.1rem 2rem;
      }
      .auth-aside {
        padding: 1.1rem 1.1rem 1.35rem;
        gap: 1rem;
        min-height: 132px;
      }
      .auth-title {
        font-size: 1.45rem;
        line-height: 1.15;
        margin-top: 0;
      }
      .auth-desc {
        max-width: none;
        font-size: 0.95rem;
        line-height: 1.55;
      }
      .auth-choices {
        grid-template-columns: 1fr;
      }
      .auth-note,
      .auth-sub,
      .auth-check {
        line-height: 1.55;
      }
      .auth-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-label="Registro en Lexi">
      <aside class="auth-aside">
        <div class="auth-aside-content">
          <h2 class="auth-title">Crea tu cuenta <i class="bi bi-person-plus" aria-hidden="true"></i></h2>
          <p class="auth-desc">Empieza desde cero y disfruta de Lexi.</p>
        </div>
      </aside>
      <div class="auth-form">
        <h1>Regístrate</h1>
        <p class="auth-sub">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        <div class="auth-alert auth-alert--ok" id="registerAlert" role="alert"></div>
        <form id="registerForm" class="auth-grid" novalidate>
          <div class="auth-field">
            <label for="registerName">Nombre</label>
            <div class="auth-input-wrap">
              <i class="bi bi-person"></i>
              <input class="auth-input" id="registerName" type="text" placeholder="Tu nombre" maxlength="30" required>
            </div>
          </div>
          <div class="auth-field">
            <label for="registerEmail">Correo electrónico</label>
            <div class="auth-input-wrap">
              <i class="bi bi-envelope"></i>
              <input class="auth-input" id="registerEmail" type="email" placeholder="tu@ejemplo.com" required>
            </div>
          </div>
          <div class="auth-field">
            <label for="registerPassword">Contraseña</label>
            <div class="auth-input-wrap">
              <i class="bi bi-lock"></i>
              <input class="auth-input" id="registerPassword" type="password" placeholder="Mínimo 6 caracteres" required>
            </div>
          </div>
          <div class="auth-field">
            <label for="registerPasswordConfirm">Repetir contraseña</label>
            <div class="auth-input-wrap">
              <i class="bi bi-shield-lock"></i>
              <input class="auth-input" id="registerPasswordConfirm" type="password" placeholder="Repite tu contraseña" required>
            </div>
          </div>
          <div class="auth-field">
            <label for="registerBirthDate">Fecha de nacimiento</label>
            <div class="auth-input-wrap">
              <i class="bi bi-calendar-event"></i>
              <input class="auth-input" id="registerBirthDate" type="date" required>
            </div>
          </div>
          <div class="auth-field">
            <label for="registerNativeLanguage">Idioma materno</label>
            <div class="auth-input-wrap auth-input-wrap--select" data-flag-select-wrap>
              <i class="bi bi-translate"></i>
              <img class="auth-flag-icon" data-flag-icon alt="" aria-hidden="true">
              <select class="auth-input" id="registerNativeLanguage" required>
                <option value="">Selecciona tu idioma</option>
                <option value="en">Inglés</option>
                <option value="fr">Francés</option>
                <option value="de">Alemán</option>
                <option value="es">Español</option>
                <option value="it">Italiano</option>
                <option value="pt">Portugués</option>
                <option value="no">Noruego</option>
                <option value="sv">Sueco</option>
                <option value="dk">Danés</option>
                <option value="fi">Finés</option>
                <option value="ko">Coreano</option>
                <option value="ja">Japonés</option>
                <option value="zh">Chino</option>
                <option value="ru">Ruso</option>
                <option value="ua">Ucraniano</option>
                <option value="bg">Búlgaro</option>
                <option value="ro">Rumano</option>
                <option value="cs">Checo</option>
                <option value="sk">Eslovaco</option>
                <option value="hu">Húngaro</option>
                <option value="gr">Griego</option>
                <option value="ar">Árabe</option>
                <option value="vi">Vietnamita</option>
                <option value="pl">Polaco</option>
                <option value="tr">Turco</option>
                <option value="id">Indonesio</option>
                <option value="he">Hebreo</option>
                <option value="hi">Hindi</option>
                <option value="th">Tailandés</option>
                <option value="nl">Neerlandés</option>
              </select>
            </div>
          </div>
          <div class="auth-field">
            <label for="registerTargetLanguage">Idioma que deseas aprender</label>
            <div class="auth-input-wrap auth-input-wrap--select" data-flag-select-wrap>
              <i class="bi bi-globe-europe-africa"></i>
              <img class="auth-flag-icon" data-flag-icon alt="" aria-hidden="true">
              <select class="auth-input" id="registerTargetLanguage" required>
                <option value="">Selecciona el idioma</option>
                <option value="en">Inglés</option>
                <option value="fr">Francés</option>
                <option value="de">Alemán</option>
                <option value="es">Español</option>
                <option value="it">Italiano</option>
                <option value="pt">Portugués</option>
                <option value="no">Noruego</option>
                <option value="sv">Sueco</option>
                <option value="dk">Danés</option>
                <option value="fi">Finés</option>
                <option value="ko">Coreano</option>
                <option value="ja">Japonés</option>
                <option value="zh">Chino</option>
                <option value="ru">Ruso</option>
                <option value="ua">Ucraniano</option>
                <option value="bg">Búlgaro</option>
                <option value="ro">Rumano</option>
                <option value="cs">Checo</option>
                <option value="sk">Eslovaco</option>
                <option value="hu">Húngaro</option>
                <option value="gr">Griego</option>
                <option value="ar">Árabe</option>
                <option value="vi">Vietnamita</option>
                <option value="pl">Polaco</option>
                <option value="tr">Turco</option>
                <option value="id">Indonesio</option>
                <option value="he">Hebreo</option>
                <option value="hi">Hindi</option>
                <option value="th">Tailandés</option>
                <option value="nl">Neerlandés</option>
              </select>
            </div>
          </div>
          <label class="auth-check"><input type="checkbox" id="registerTerms" required><span>Acepto los <a href="terminos.html">términos y condiciones</a> y la <a href="privacidad.html">política de privacidad</a>.</span></label>
          <button class="auth-btn" type="submit">Crear cuenta</button>
        </form>
      </div>
    </section>
  </main>

  <script>
  (function () {
    const flagByLanguage = {
      es: 'icons/flags/spain_flag.svg',
      en: 'icons/flags/united_kingdom_flag.svg',
      fr: 'icons/flags/france_flag.svg',
      de: 'icons/flags/germany_flag.svg',
      it: 'icons/flags/italy_flag.svg',
      pt: 'icons/flags/brazil_flag.svg',
      no: 'icons/flags/norway_flag.svg',
      sv: 'icons/flags/sweden_flag.svg',
      dk: 'icons/flags/denmark_flag.svg',
      fi: 'icons/flags/finland_flag.svg',
      ko: 'icons/flags/south_korea_flag.svg',
      ja: 'icons/flags/japan_flag.svg',
      zh: 'icons/flags/china_flag.svg',
      ru: 'icons/flags/russia_flag.svg',
      ua: 'icons/flags/ukraine_flag.svg',
      bg: 'icons/flags/bulgaria_flag.svg',
      ro: 'icons/flags/romania_flag.svg',
      cs: 'icons/flags/czech_republic_flag.svg',
      sk: 'icons/flags/slovakia_flag.svg',
      hu: 'icons/flags/hungary_flag.svg',
      gr: 'icons/flags/greece_flag.svg',
      ar: 'icons/flags/saudi_arabia_flag.svg',
      vi: 'icons/flags/vietnam_flag.svg',
      pl: 'icons/flags/poland_flag.svg',
      tr: 'icons/flags/turkey_flag.svg',
      id: 'icons/flags/indonesia_flag.svg',
      he: 'icons/flags/israel_flag.svg',
      hi: 'icons/flags/india_flag.svg',
      th: 'icons/flags/thailand_flag.svg',
      nl: 'icons/flags/netherlands_flag.svg'
    };
    const form = document.getElementById('registerForm');
    const alertBox = document.getElementById('registerAlert');
    const languageSelects = document.querySelectorAll('[data-flag-select-wrap] select');

    function syncFlag(select) {
      const wrap = select.closest('[data-flag-select-wrap]');
      const flagIcon = wrap.querySelector('[data-flag-icon]');
      const flagSrc = flagByLanguage[select.value];

      if (!flagSrc) {
        wrap.classList.remove('has-flag');
        flagIcon.removeAttribute('src');
        return;
      }

      flagIcon.src = flagSrc;
      wrap.classList.add('has-flag');
    }

    languageSelects.forEach((select) => {
      syncFlag(select);
      select.addEventListener('change', () => syncFlag(select));
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const name = document.getElementById('registerName').value.trim();
      const email = document.getElementById('registerEmail').value.trim();
      const password = document.getElementById('registerPassword').value;
      const passwordConfirm = document.getElementById('registerPasswordConfirm').value;
      const birthDate = document.getElementById('registerBirthDate').value;
      const nativeLanguage = document.getElementById('registerNativeLanguage').value;
      const targetLanguage = document.getElementById('registerTargetLanguage').value;
      const accepted = document.getElementById('registerTerms').checked;
      if (!name || !email.includes('@') || password.length < 6 || password !== passwordConfirm || !birthDate || !nativeLanguage || !targetLanguage || !accepted) {
        alertBox.textContent = 'Completa todos los campos, revisa las contraseñas y acepta la condición demo para continuar.';
        alertBox.className = 'auth-alert auth-alert--ok show';
        return;
      }
      localStorage.setItem('lexiUser', JSON.stringify({
        name,
        email,
        birthDate,
        nativeLanguage,
        targetLanguage
      }));
      localStorage.setItem('lexiPrefs', JSON.stringify({
        onboardingComplete: true,
        nativeLanguage,
        targetLanguage
      }));
      alertBox.textContent = 'Cuenta creada. Redirigiendo al inicio de sesión…';
      alertBox.className = 'auth-alert auth-alert--ok show';
      setTimeout(() => { window.location.href = 'login.html'; }, 900);
    });
  })();
  </script>
</body>
</html>
