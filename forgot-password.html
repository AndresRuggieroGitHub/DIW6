<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Recupera el acceso a tu cuenta Lexi.">
  <meta name="robots" content="noindex">
  <title>Lexi | Recuperar contraseña</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --violet: #7c3aed;
      --violet-mid: #9d4edd;
      --text: #1a1a2e;
      --muted: #6b7280;
      --line: #e5e7eb;
      --surface: #f9fafb;
    }

    html, body {
      min-height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(245, 158, 11, 0.16), transparent 24%),
        radial-gradient(circle at 85% 16%, rgba(216, 180, 254, 0.62), transparent 23%),
        linear-gradient(160deg, #dccdea 0%, #f8f3fe 54%, #e2e5f4 100%);
      color: var(--text);
    }

    .recovery-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: linear-gradient(180deg, rgba(210, 196, 229, 0.95) 0%, rgba(190, 172, 216, 0.72) 52%, rgba(156, 140, 186, 0.42) 100%);
    }
    .recovery-card {
      width: min(100%, 980px);
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      background: #fff;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 28px 70px rgba(51, 24, 96, 0.22);
    }

    .recovery-brand-panel {
      padding: 3rem;
      background: radial-gradient(circle at top left, rgba(216, 180, 254, 0.8), transparent 38%), linear-gradient(145deg, #581c87 0%, #7c3aed 55%, #c084fc 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1rem;
      position: relative;
      overflow: hidden;
    }
    .recovery-brand-content {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      z-index: 1;
    }
    .recovery-brand-headline {
      display: inline-flex;
      align-items: center;
      gap: 0.58rem;
      font-size: clamp(1.95rem, 2.8vw, 2.55rem);
      font-weight: 800;
      color: #fff;
      line-height: 1.08;
      letter-spacing: -0.05em;
      margin: 0;
    }
    .recovery-brand-headline i {
      font-size: 0.94em;
      color: #fff;
      line-height: 1;
    }
    .recovery-brand-desc {
      font-size: 1rem;
      color: rgba(255,255,255,0.82);
      line-height: 1.6;
      max-width: 21rem;
      margin: 0;
    }

    .recovery-form-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 3rem;
      background: #fff;
    }
    .recovery-form-wrap {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }
    .recovery-form-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.04em;
      margin-bottom: 0.4rem;
    }
    .recovery-form-sub {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .recovery-form-sub a {
      color: var(--violet);
      font-weight: 600;
      text-decoration: none;
    }
    .recovery-form-sub a:hover { text-decoration: underline; }

    .recovery-field {
      margin-bottom: 1.1rem;
    }
    .recovery-field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.45rem;
    }
    .recovery-input-wrap {
      position: relative;
    }
    .recovery-input-wrap > i {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.05rem;
      color: #9ca3af;
      pointer-events: none;
    }
    .recovery-input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--surface);
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }
    .recovery-input:focus {
      border-color: var(--violet);
      box-shadow: 0 0 0 3px rgba(124,58,237,0.1);
      background: #fff;
    }
    .recovery-input::placeholder { color: #c4c4cc; }

    .recovery-btn-primary {
      width: 100%;
      padding: 0.85rem 1.5rem;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--violet) 0%, var(--violet-mid) 100%);
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      margin-top: 0.7rem;
      letter-spacing: -0.01em;
    }
    .recovery-btn-primary:hover { opacity: 0.92; }
    .recovery-btn-primary:active { transform: scale(0.98); }

    .recovery-back-note {
      margin-top: 1.1rem;
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.55;
    }
    .recovery-back-note a {
      color: var(--violet);
      font-weight: 600;
      text-decoration: none;
    }
    .recovery-back-note a:hover { text-decoration: underline; }

    .recovery-footer-note {
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
      margin-top: 1.75rem;
      line-height: 1.6;
    }

    .recovery-alert {
      display: none;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 1.1rem;
    }
    .recovery-alert.show { display: block; }
    .recovery-alert--error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .recovery-alert--success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }

    @media (max-width: 860px) {
      .recovery-card { grid-template-columns: 1fr; }
      .recovery-brand-panel {
        padding: 1.8rem 2rem;
        min-height: 132px;
      }
      .recovery-form-panel { padding: 2rem; }
      .recovery-brand-content {
        width: 100%;
        max-width: 400px;
        margin: 0 auto;
        gap: 0.85rem;
      }
      .recovery-brand-headline {
        font-size: clamp(1.85rem, 2.45vw, 2.3rem);
      }
      .recovery-brand-desc {
        max-width: 20rem;
        font-size: 0.96rem;
        line-height: 1.5;
      }
    }

    @media (max-width: 640px) {
      .recovery-page {
        padding: 0.8rem;
        place-items: stretch;
      }
      .recovery-card {
        width: 100%;
        min-height: calc(100vh - 1.6rem);
        border-radius: 20px;
        box-shadow: 0 18px 40px rgba(76, 29, 149, 0.12);
      }
      .recovery-form-panel {
        padding: 1.35rem 1.1rem 2rem;
      }
      .recovery-brand-panel {
        padding: 0.9rem 1.1rem 1rem;
        gap: 0.6rem;
        min-height: 132px;
      }
      .recovery-brand-content {
        max-width: none;
        gap: 0.6rem;
      }
      .recovery-brand-headline {
        font-size: 1.34rem;
        line-height: 1.15;
      }
      .recovery-brand-desc {
        max-width: none;
        font-size: 0.84rem;
        line-height: 1.35;
      }
      .recovery-form-title {
        font-size: 1.6rem;
      }
      .recovery-form-sub,
      .recovery-footer-note {
        line-height: 1.55;
      }
      .recovery-btn-primary {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<main class="recovery-page">
  <section class="recovery-card" aria-label="Recuperación de contraseña en Lexi">
    <aside class="recovery-brand-panel">
      <div class="recovery-brand-content">
        <h1 class="recovery-brand-headline">Recupera tu acceso <i class="bi bi-key" aria-hidden="true"></i></h1>
        <p class="recovery-brand-desc">
          Te enviaremos instrucciones por correo.
        </p>
      </div>
    </aside>

    <div class="recovery-form-panel">
      <div class="recovery-form-wrap">
        <h2 class="recovery-form-title">¿Olvidaste tu contraseña?</h2>
        <p class="recovery-form-sub">Introduce tu correo para poder recuperar tu cuenta.</p>
        <div class="recovery-alert" id="recoveryAlert" role="alert"></div>

        <form id="recoveryForm" novalidate>
          <div class="recovery-field">
            <label for="recoveryEmail">Correo electrónico</label>
            <div class="recovery-input-wrap">
              <i class="bi bi-envelope"></i>
              <input
                type="email"
                id="recoveryEmail"
                name="email"
                class="recovery-input"
                placeholder="tu@ejemplo.com"
                autocomplete="email"
                required
              >
            </div>
          </div>

          <button type="submit" class="recovery-btn-primary">Enviar enlace</button>
        </form>

        <p class="recovery-back-note">
          ¿Quieres volver a intentarlo? <a href="login.html">Inicia sesión</a>
        </p>

      </div>
    </div>
  </section>
</main>

<script>
(function () {
  const showAlert = (msg, type = 'error') => {
    const el = document.getElementById('recoveryAlert');
    el.textContent = msg;
    el.className = `recovery-alert show recovery-alert--${type}`;
  };

  const hideAlert = () => {
    document.getElementById('recoveryAlert').className = 'recovery-alert';
  };

  document.getElementById('recoveryForm').addEventListener('submit', (event) => {
    event.preventDefault();
    hideAlert();

    const email = document.getElementById('recoveryEmail').value.trim();
    if (!email || !email.includes('@')) {
      showAlert('Introduce un correo electrónico válido.');
      document.getElementById('recoveryEmail').focus();
      return;
    }

    showAlert('Hemos enviado las instrucciones al correo indicado.', 'success');
  });
})();
</script>
</body>
</html>
