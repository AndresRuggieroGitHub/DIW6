<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Lexi | Redirigiendo</title>
  <script>
    (function () {
      var fileName = window.location.pathname.split('/').pop() || 'login.html';
      var target = new URL('public/' + fileName + window.location.search + window.location.hash, window.location.href);
      window.location.replace(target.toString());
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=public/login.html">
  </noscript>
</head>
<body>
  <p>Redirecting to the app...</p>
</body>
</html>
